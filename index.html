<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Halloween theme website with Midnight Graveyard Stroll scene using CSS">
    <title>Midnight Grave Stroll</title>
    <link rel="stylesheet" href="haunted-harvest.css">
</head>
<body>
    <main class="scenes">
        <section id="scene1" class="scene">
            <div class="sky">
                <div class="ground"></div>
                
                <div class="moon"></div>

                <div class="cloud cloud-one"></div>
                <div class="cloud cloud-two"></div>

                <div class="ghost-orbs">
                    <div class="orb orb-one"></div>
                    <div class="orb orb-two"></div>
                    <div class="orb orb-three"></div>
                </div>

                <div class="couple-path">
                    <img src="assets/images/couple.webp"
                        class="walking-couple"
                        alt="Couple walking together">
                </div>

                <div class="cat-path">
                    <img
                        src="assets/images/cat.png"
                        class="trotting-cat"
                        alt="Black cat trotting along the path"
                    >
                </div>


                <!-- Small ghosts appear when hover over gravestone -->
                <div class="gravestone-row">
                    <div class="gravestone">
                        🪦
                        <div class="ghost">👻</div>
                    </div>

                    <div class="gravestone">
                        🪦
                        <div class="ghost">👻</div>
                    </div>

                    <div class="gravestone">
                        🪦
                        <div class="ghost">👻</div>
                    </div>

                    <div class="gravestone">
                        🪦
                        <div class="ghost">👻</div>
                    </div>

                    <div class="gravestone">
                        🪦
                        <div class="ghost">👻</div>
                    </div>
                </div>

                <div class="cyclist">
                    🚴🏻
                </div>

                <img
                    src="assets/images/dead_tree1.png"
                    class="dead-tree tree-one"
                    alt="Dead tree">

                <img
                    src="assets/images/dead_tree2.png"
                    class="dead-tree tree-two"
                    alt="Dead tree">

                <img
                    src="assets/images/dead_tree3.png"
                    class="dead-tree tree-three"
                    alt="Dead tree">

            </div>
            
        </section>
    </main>
</body>
</html>
